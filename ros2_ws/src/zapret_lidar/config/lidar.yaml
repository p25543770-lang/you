# Параметры супервизора лидара (zapret_lidar/lidar_supervisor).
# Те же значения можно задать аргументами launch-файла (model:=…) или через
# --ros-args -p key:=value; .env-настройки RC_LIDAR_* подставляет
# scripts/ros2_lidar.sh, поэтому руками этот файл править обычно не нужно.
lidar_supervisor:
  ros__parameters:
    # auto — подобрать драйвер под подключённый лидар; можно указать явно:
    # lds01 | rplidar | ld06 | ld19 | stl27l | opencr
    model: auto
    # Пусто — искать порт самому (/dev/serial/by-id/*lidar*, /dev/ttyUSB*, /dev/ttyACM*).
    # Можно список через запятую или glob: /dev/ttyUSB0,/dev/ttyUSB1
    port: ""
    # 0 — скорость по умолчанию для драйвера (LDS-01 и LD06/LD19 — 230400,
    # RPLIDAR — по модели: 115200/256000/460800).
    baud: 0
    # Топик скана: сюда публикует драйвер, отсюда читает веб-приложение.
    scan_topic: /scan
    # Топик состояния (std_msgs/String, JSON): GET /api/lidar → ros.supervisor.
    status_topic: /zapret/lidar/status
    frame_id: base_scan
    # Сколько секунд ждать /scan после запуска драйвера, прежде чем пробовать
    # следующий (LDS-01 успевает раскрутиться за 1-2 с).
    probe_timeout: 8.0
    # Через сколько секунд без точек считать драйвер вставшим и перезапустить.
    scan_timeout: 3.0
    # Запускать драйвер сразу при старте узла; false — только по сервису ~/rescan.
    autostart: true
    # Быстро проверять порты (pyserial) перед запуском драйвера: позволяет
    # auto-режиму сразу выбрать правильный пакет, а не перебирать по таймауту.
    autoprobe: true
    # Период публикации состояния, с.
    tick: 1.0
