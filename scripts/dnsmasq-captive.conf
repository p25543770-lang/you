# Captive portal для режима «shared» в NetworkManager.
#
# NetworkManager в режиме ipv4.method=shared сам поднимает dnsmasq и читает
# файлы из /etc/NetworkManager/dnsmasq-shared.d/. Строка ниже отвечает на любой
# DNS-запрос адресом робота — телефон при подключении сразу показывает нашу
# страницу входа вместо «требуется авторизация в сети».
#
# Установка:
#   sudo cp scripts/dnsmasq-captive.conf /etc/NetworkManager/dnsmasq-shared.d/robot.conf
#   sudo ./scripts/setup_ap.sh --down && sudo ./scripts/setup_ap.sh
#
address=/#/10.42.0.1
